  return `<div class="workspace"><aside class="sidebar"><div class="side-heading">联系</div><div class="side-contact"><a href="mailto:3077824140@qq.com">${icons.mail}3077824140@qq.com</a><br><a href="tel:15712965289">${icons.phone}15712965289</a></div><div class="side-section"><div class="side-heading">适合交流</div><div class="social-list"><span>↗ AI 解决方案</span><span>↗ Data Agent</span><span>↗ 跨境电商产品</span><span>↗ 数据增长分析</span></div></div></aside><div class="work-area"><div class="file-tabs"></div><div class="content-panes"><div class="editor-pane contact-left"><form class="contact-form" onsubmit="submitContact(event)"><div class="form-field"><label>_姓名：</label><input value="${escapeAttr(contactName)}" oninput="updateField('name', this.value)" required /></div><div class="form-field"><label>_邮箱：</label><input type="email" value="${escapeAttr(contactEmail)}" oninput="updateField('email', this.value)" required /></div><div class="form-field"><label>_留言：</label><textarea oninput="updateField('message', this.value)" required>${escapeHtml(contactMessage)}</textarea></div><button class="btn-editor" type="submit">撰写邮件</button></form></div><div class="editor-pane contact-code">${renderContactCode(contactName, contactEmail, contactMessage, date)}</div></div></div></div>`;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return s.replace(/"/g,'&quot;'); }
function render() { const app = document.getElementById('app'); let content; if (currentRoute === '/') { content = renderHome(); app.innerHTML = renderShell(content); status = 'ready'; score = 0; snake = startSnake.slice(); food = {...initialFood}; direction = 'right'; renderGame(); const restartBtn = document.getElementById('game-restart'); if (restartBtn) restartBtn.onclick = resetGame; } else if (currentRoute === '/about') { content = renderAbout(); app.innerHTML = renderShell(content); } else if (currentRoute === '/projects') { content = renderProjects(); app.innerHTML = renderShell(content); } else if (currentRoute === '/contact') { content = renderContact(); app.innerHTML = renderShell(content); } }
initTheme(); currentRoute = getRouteFromHash(); render();
</script>
